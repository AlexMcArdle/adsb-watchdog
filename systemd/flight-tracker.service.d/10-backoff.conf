# Back off when the CoolLED Bluetooth panel is unreachable.
#
# run_display.sh exhausts 5 BLE connect retries (~55s) and exits 1. With
# RestartSec=10 that meant a restart every ~65s, and every start runs
# ExecStartPre=systemctl restart bluetooth -- so an LED panel that is simply
# powered off kept bouncing the Bluetooth stack indefinitely.
#
# Now: 3 attempts per 30 minutes, then systemd stops. adsb-watchdog retries at
# most once every 10 minutes and clears the failed state when it does.
[Unit]
StartLimitIntervalSec=1800
StartLimitBurst=3

[Service]
RestartSec=120
