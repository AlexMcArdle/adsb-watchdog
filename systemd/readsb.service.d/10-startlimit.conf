# Stop readsb from hot-looping when the SDR is absent.
#
# The packaged unit sets StartLimitInterval=1 / StartLimitBurst=100 in
# [Service], which is both the legacy key name and the wrong section, so it is
# ignored -- the effect was unlimited restarts (observed: 24 in ~6 minutes,
# each a fresh process on a 1 GB Pi).
#
# With these limits systemd gives up after 5 failures in 5 minutes.
# adsb-watchdog runs every 60s, clears the failed state and restarts once the
# radio is actually back, so giving up here loses no recovery capability.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
RestartSec=30
